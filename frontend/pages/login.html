<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BurgerClick — Iniciar sesión</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <script src="../js/script.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <a class="brand-link" href="../index.html" aria-label="BurgerClick, ir al inicio">
      <img class="logo" src="../assets/logo.svg" alt="" />
      <span class="brand-copy">
        <span class="brand-name">Burger<span>Click</span></span>
      </span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <ul>
        <li data-roles="todos"><a href="../index.html">Inicio</a></li>
        <li data-roles="todos"><a href="menu.html">Menú</a></li>
        <li data-roles="cliente"><a href="pedido.html">Nuevo pedido</a></li>
        <li data-roles="cliente"><a href="mis-pedidos.html">Mis pedidos</a></li>
        <li data-roles="cocina"><a href="cocina.html">Cocina</a></li>
        <li data-roles="dueno"><a href="tablero.html">Tablero</a></li>
        <li data-roles="visitante"><a href="login.html" class="activo">Iniciar sesión</a></li>
        <li data-roles="cliente cocina dueno"><a href="#" data-cerrar-sesion>Cerrar sesión</a></li>
      </ul>
      <span class="saludo" data-usuario-conectado></span>
    </nav>
  </header>

  <main>
    <section class="seccion">
      <h1>Iniciar sesión</h1>
      <p>
        Ingresá tus credenciales para acceder a tu cuenta de BurgerClick.
      </p>

      <div id="login-mensaje"></div>

      <form id="form-login">
        <div class="campo">
          <label for="usuario">Usuario o correo electrónico</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Ej: rocio.gomez@mail.com"
            required
          />
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="acciones-form">
          <button type="submit" class="btn">Ingresar</button>
          <a href="../index.html" class="btn btn-claro">Cancelar</a>
        </div>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <p>BurgerClick © 2026 — CABA, Argentina · Canal digital exclusivo del local.</p>
  </footer>
</body>
</html>
